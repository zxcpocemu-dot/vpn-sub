name: Update VPN Subscription

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install aiohttp pyyaml

      - name: Run filter
        run: python filter.py

      - name: Commit updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p out
          git add out/ || true
          git diff --staged --quiet || git commit -m "Auto-update subscription [skip ci]"
          git push
